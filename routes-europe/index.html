  else if(f[0]==='cz'){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h/2);ctx.fillStyle='#D7141A';ctx.fillRect(0,h/2,w,h/2);ctx.fillStyle='#11457E';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w*.5,h/2);ctx.lineTo(0,h);ctx.fill()}
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.strokeRect(0,0,w,h);ctx.restore()}
const EASY=['Italia','Francia','Germania','Spagna','Regno Unito','Grecia','Portogallo','Svizzera'];
let wrong=0,lost=0,booms=[],P=[],sel=null,hov=null,t=0,ok=0,err=0,spawnT=0,over=true,landed=[],flashes=[],labels=[],deck=[];
function hud(){$('ok').textContent=ok;$('wrong').textContent=wrong;$('lost').textContent=lost;const r=Math.max(0,Math.ceil(TIME-t));$('time').textContent=`${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`}
function pickCountry(){if(!deck.length){const pool=ok<4?EASY:TGT.map(c=>c.n);deck=[...pool].sort(()=>Math.random()-.5)}const inAir=P.map(q=>q.n);let n=deck.pop();if(inAir.includes(n)&&deck.length)n=deck.pop();return n}
function spawn(sd){for(let tries=0;tries<8;tries++){const side=sd!==undefined?(sd+tries)%4:Math.floor(Math.random()*4);let x,y,a;
  if(side===0){x=14;y=90+Math.random()*(H-220);a=Math.random()*.6-.3}else if(side===1){x=W-14;y=90+Math.random()*(H-220);a=Math.PI+Math.random()*.6-.3}else if(side===2){x=80+Math.random()*(W-160);y=14;a=Math.PI/2+Math.random()*.6-.3}else{x=80+Math.random()*(W-160);y=H-14;a=-Math.PI/2+Math.random()*.6-.3}
  if(P.some(q=>Math.hypot(q.x-x,q.y-y)<90))continue;
  P.push({x,y,a,sp:40+Math.min(ok,14)*1.6,n:pickCountry(),path:[],alive:true,age:0});return}}
function countryAt(x,y){for(const c of C)if(test.isPointInPath(c.p,x,y))return c;return null}
function targetNear(x,y){const c=countryAt(x,y);if(c&&c.n)return c;const votes=new Map();
  for(const r of [8,14,20,26])for(let k=0;k<12;k++){const a=k*Math.PI/6,q=countryAt(x+Math.cos(a)*r,y+Math.sin(a)*r);if(q&&q.n)votes.set(q,(votes.get(q)||0)+(30-r))}
  let best=null,bv=0;votes.forEach((v,q)=>{if(v>bv){bv=v;best=q}});return best||c}
function start(){P=[];sel=null;t=0;ok=0;err=0;wrong=0;lost=0;booms=[];spawnT=0;over=false;landed=[];flashes=[];labels=[];deck=[];$('ov').hidden=true;picked=null;$('msg').textContent='Tocca un aereo, poi il paese della sua bandiera.';[0,1,2].forEach(sd=>spawn(sd));spawnT=1;hud()}
function end(why){over=true;$('ovT').textContent=`${ok} atterraggi riusciti`;$('ovS').outerHTML=`<p id="ovS">${why}</p>`;$('recap').innerHTML=landed.map(n=>`<span>${n}</span>`).join('');$('start').textContent='Nuova partita';$('ov').hidden=false}
function mistake(){wrong++;hud()}
function pos(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H}}
let dragging=false,picked=null;
function planeAt(p){let b=null,bd=48;P.forEach(q=>{const d=Math.hypot(q.x-p.x,q.y-p.y),d2=Math.hypot(q.x-p.x,q.y-34-p.y);const dd=Math.min(d,d2);if(dd<bd){bd=dd;b=q}});return b}
function commit(q,end){const c=targetNear(end.x,end.y);if(!c){$('msg').textContent='Lì c\'è il mare: tocca un paese.';q.path=[];q.dest=null;return}const inside=test.isPointInPath(c.p,end.x,end.y);q.dest={c,x:inside?end.x:c.c[0],y:inside?end.y:c.c[1]};$('msg').textContent=''}
cv.addEventListener('pointerdown',ev=>{if(over)return;const p=pos(ev);const b=planeAt(p);
  if(b){cv.setPointerCapture(ev.pointerId);sel=b;dragging=true;b.path=[];b.startP=p;return}
  if(picked&&picked.alive){picked.path=[p];commit(picked,p);picked=null}});
cv.addEventListener('pointermove',ev=>{const p=pos(ev);if(sel&&dragging){const l=sel.path[sel.path.length-1]||sel.startP;if(Math.hypot(l.x-p.x,l.y-p.y)>9)sel.path.push(p);hov=targetNear(p.x,p.y)}else hov=null});
cv.addEventListener('pointerup',ev=>{if(!sel)return;const q=sel;sel=null;dragging=false;hov=null;
  if(q.path.length<3){q.path=[];picked=q;$('msg').textContent='Ora tocca il paese della bandiera.';return}
  commit(q,q.path[q.path.length-1])});
function land(q){const c=q.dest.c;q.alive=false;if(picked===q)picked=null;
  if(c.n===q.n){ok++;landed.push(q.n);flashes.push({c,col:'ok',t});labels.push({txt:c.n,x:c.c[0],y:c.c[1],t,col:'ok'});$('msg').textContent=`${q.n}: atterraggio perfetto!`;hud()}
  else{const right=byName[q.n];flashes.push({c,col:'bad',t});flashes.push({c:right,col:'ok',t,long:true});labels.push({txt:`era ${q.n}`,x:right.c[0],y:right.c[1],t,col:'ok'});$('msg').textContent=`No: la bandiera era ${q.n}${c.n?`, sei atterrato in ${c.n}`:''}.`;mistake()}
  return true}
function step(dt){if(over)return;t+=dt;if(t>=TIME){end(`Tempo scaduto. Sbagliati: ${wrong}, persi negli scontri: ${lost}.`);return}
  spawnT-=dt;const maxAir=Math.min(7,4+Math.floor(t/20));if(spawnT<=0&&P.length<maxAir){spawn();spawnT=Math.max(.9,1.5-t/100)}
  P.forEach(q=>{q.age+=dt;
    if(q.dest&&q!==sel){if(Math.hypot(q.dest.x-q.x,q.dest.y-q.y)<16){land(q);return}
      while(q.path.length>1&&Math.hypot(q.path[0].x-q.x,q.path[0].y-q.y)<18)q.path.shift();
      const tg=q.path.length?q.path[0]:q.dest,ta=Math.atan2(tg.y-q.y,tg.x-q.x);let da=ta-q.a;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
      const near=Math.hypot(q.dest.x-q.x,q.dest.y-q.y)<70;q.a+=Math.max(-(near?14:7)*dt,Math.min((near?14:7)*dt,da))}
    q.x+=Math.cos(q.a)*q.sp*dt;q.y+=Math.sin(q.a)*q.sp*dt;
    if(q.age>2&&!q.dest){if(q.x<20&&Math.cos(q.a)<0||q.x>W-20&&Math.cos(q.a)>0){q.a=Math.PI-q.a;q.path=[]}if(q.y<20&&Math.sin(q.a)<0||q.y>H-20&&Math.sin(q.a)>0){q.a=-q.a;q.path=[]}}});
  P=P.filter(q=>q.alive);
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(a.alive&&b.alive&&a.age>2&&b.age>2&&Math.hypot(a.x-b.x,a.y-b.y)<26){a.alive=b.alive=false;if(picked===a||picked===b)picked=null;booms.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,t,parts:[...Array(18)].map(()=>{const an=Math.random()*6.28,v=60+Math.random()*160;return{vx:Math.cos(an)*v,vy:Math.sin(an)*v}})});lost+=2;$('msg').textContent=`Scontro! Persi ${a.n} e ${b.n}.`;hud()}}
  P=P.filter(q=>q.alive);booms=booms.filter(x=>t-x.t<1.2);flashes=flashes.filter(f=>t-f.t<(f.long?2.5:1.4));labels=labels.filter(l=>t-l.t<2.5)}
function plane(q){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.a);ctx.scale(.8,.8);ctx.fillStyle=css('--ink');ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-14,-7);ctx.lineTo(-14,7);ctx.closePath();ctx.fill();ctx.fillRect(-4,-18,8,36);ctx.fillRect(-16,-8,4,16);ctx.restore();
  const fw=40,fh=26;ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=6;flag(q.n,q.x-fw/2,q.y-fh-18,fw,fh);ctx.restore();
  if(q===sel||q===picked){ctx.strokeStyle='#F2C230';ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,22,0,7);ctx.stroke()}}
function draw(){const rc=cv.getBoundingClientRect(),d=devicePixelRatio||1,w=Math.round(rc.width*d),h=Math.round(rc.height*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  ctx.setTransform(cv.width/W,0,0,cv.width/W,0,0);ctx.fillStyle=css('--sea');ctx.fillRect(0,0,W,H);
  C.forEach(c=>{ctx.fillStyle=c===hov?css('--hover'):c.n?css('--land'):css('--other');ctx.fill(c.p);ctx.strokeStyle=css('--border');ctx.lineWidth=1;ctx.stroke(c.p)});
  flashes.forEach(f=>{const a=1-(t-f.t)/(f.long?2.5:1.4);if(f.c){ctx.globalAlpha=Math.max(0,a)*.7;ctx.fillStyle=css(f.col==='ok'?'--ok':'--bad');ctx.fill(f.c.p);ctx.globalAlpha=1}else{ctx.strokeStyle=css('--bad');ctx.lineWidth=5;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(f.pt.x,f.pt.y,20+40*(1-a),0,7);ctx.stroke();ctx.globalAlpha=1}});
  P.forEach(q=>{if(q.path.length||q.dest){ctx.setLineDash([7,8]);ctx.strokeStyle=css('--ink');ctx.globalAlpha=.7;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(q.x,q.y);q.path.forEach(p=>ctx.lineTo(p.x,p.y));if(q.dest)ctx.lineTo(q.dest.x,q.dest.y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;const e=q.dest||q.path[q.path.length-1];ctx.fillStyle=css('--ink');ctx.beginPath();ctx.arc(e.x,e.y,5,0,7);ctx.fill()}});
  const warn=new Set();for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(a.age<1.5||b.age<1.5)continue;const d=Math.hypot(a.x-b.x,a.y-b.y);
    const ax=a.x+Math.cos(a.a)*a.sp*.8,ay=a.y+Math.sin(a.a)*a.sp*.8,bx=b.x+Math.cos(b.a)*b.sp*.8,by=b.y+Math.sin(b.a)*b.sp*.8;if(d<72&&Math.hypot(ax-bx,ay-by)<d){warn.add(a);warn.add(b)}}
  warn.forEach(q=>{const pu=(Math.sin(t*14)+1)/2;ctx.strokeStyle=css('--bad');ctx.lineWidth=3;ctx.globalAlpha=.5+.5*pu;ctx.beginPath();ctx.arc(q.x,q.y,24+pu*5,0,7);ctx.stroke();ctx.globalAlpha=1});
  if(P.length&&!picked&&ok===0&&!P.some(q=>q.dest)){const q=P.find(q=>q.x>0&&q.x<W&&q.y>0&&q.y<H);if(q){const pu=(Math.sin(t*5)+1)/2;ctx.strokeStyle='#F2C230';ctx.lineWidth=3;ctx.globalAlpha=.4+.5*pu;ctx.beginPath();ctx.arc(q.x,q.y,26+8*pu,0,7);ctx.stroke();ctx.globalAlpha=1}}
  P.forEach(plane);
  booms.forEach(x=>{const k=(t-x.t)/1.2;ctx.globalAlpha=1-k;ctx.fillStyle='#F76707';x.parts.forEach(p=>{ctx.beginPath();ctx.arc(x.x+p.vx*k,x.y+p.vy*k,5*(1-k)+2,0,7);ctx.fill()});ctx.strokeStyle=css('--bad');ctx.lineWidth=4;ctx.beginPath();ctx.arc(x.x,x.y,20+50*k,0,7);ctx.stroke();ctx.globalAlpha=1});
  labels.forEach(l=>{const a=Math.min(1,2.5-(t-l.t));ctx.globalAlpha=a;ctx.font='800 20px system-ui';ctx.textAlign='center';const hw=ctx.measureText(l.txt).width/2+6;l.x=Math.max(hw,Math.min(W-hw,l.x));ctx.lineWidth=5;ctx.strokeStyle=css('--panel');ctx.strokeText(l.txt,l.x,l.y);ctx.fillStyle=css('--ink');ctx.fillText(l.txt,l.x,l.y);ctx.globalAlpha=1})}
let last=0;function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;step(dt);if(!over)hud();draw();requestAnimationFrame(frame)}
$('start').onclick=start;requestAnimationFrame(frame);
})();
