<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giochi della Fiera</title>
<style>
  :root {
    --bg: #0b2a5b;
    --bg2: #123a78;
    --card: #ffffff;
    --ink: #10213f;
    --muted: #5b6b86;
    --accent: #ffcc00;
    --accent-ink: #1a1400;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% -10%, var(--bg2), var(--bg) 60%);
    color: #fff;
    padding: 28px 16px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  .stars { color: var(--accent); letter-spacing: 6px; font-size: 14px; }
  h1 { font-size: clamp(28px, 8vw, 40px); line-height: 1.1; margin: 10px 0 8px; }
  header p { margin: 0; font-size: 17px; opacity: .85; }
  .games { display: grid; gap: 16px; }
  a.game {
    display: block;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    border-radius: 18px;
    padding: 20px 20px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    transition: transform .1s;
  }
  a.game:active { transform: scale(.98); }
  a.game h2 { margin: 0 0 6px; font-size: 22px; }
  a.game p { margin: 0 0 16px; color: var(--muted); font-size: 16px; line-height: 1.4; }
  .play {
    display: block;
    text-align: center;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    font-size: 19px;
    padding: 14px;
    border-radius: 12px;
  }
  footer { text-align: center; margin-top: 28px; font-size: 15px; opacity: .8; line-height: 1.5; }
  @media (min-width: 900px) {
    .wrap { max-width: 860px; }
    .games { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="stars">★ ★ ★ ★ ★</div>
    <h1>Giochi della Fiera</h1>
    <p>Scegli un gioco e gioca dal tuo telefono</p>
  </header>

  <main class="games" id="games"></main>

  <footer>
    Niente app, niente registrazione.<br>
    Alla fine della partita scopri le esperienze all'estero che hai raggiunto:<br>
    le trovi dal vivo negli stand della fiera.
  </footer>
</div>

<script>
  // ELENCO DEI GIOCHI
  // Per ogni gioco: nome da mostrare, una riga su cosa si fa,
  // e il nome della cartella del gioco caricata su GitHub.
  var GIOCHI = [
    {
      nome: "Esperienze all'Estero al Volo",
      descrizione: "Lancia la palla nei canestri e raccogli esperienze all'estero. Se sbagli, riprendila al volo!",
      cartella: "esperienze-al-volo"
    },
    {
      nome: "Routes Europe",
      descrizione: "Fai atterrare gli aerei con le bandiere sul paese giusto della mappa d'Europa.",
      cartella: "routes-europe"
    }
  ];

  var box = document.getElementById("games");
  GIOCHI.forEach(function (g) {
    var a = document.createElement("a");
    a.className = "game";
    a.href = "./" + g.cartella + "/index.html";
    var h = document.createElement("h2");
    h.textContent = g.nome;
    var p = document.createElement("p");
    p.textContent = g.descrizione;
    var b = document.createElement("span");
    b.className = "play";
    b.textContent = "Gioca";
    a.appendChild(h); a.appendChild(p); a.appendChild(b);
    box.appendChild(a);
  });
</script>
</body>
</html>
